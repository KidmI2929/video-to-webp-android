name: Build Windows Motion WebP

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "windows/requirements.txt"

      - name: Install Windows Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt

      - name: Get FFmpeg Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg-release-essentials.zip"
          Expand-Archive -LiteralPath "ffmpeg-release-essentials.zip" -DestinationPath "ffmpeg-unpacked"
          New-Item -ItemType Directory -Force windows/bin | Out-Null
          $ffmpeg = Get-ChildItem -Recurse "ffmpeg-unpacked" -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse "ffmpeg-unpacked" -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg files missing" }
          Copy-Item $ffmpeg.FullName windows/bin/ffmpeg.exe
          Copy-Item $ffprobe.FullName windows/bin/ffprobe.exe
          & windows/bin/ffmpeg.exe -hide_banner -encoders 2>&1 | Out-File -Encoding utf8 encoders.txt
          if (-not (Select-String -Path encoders.txt -Pattern "libwebp")) {
            throw "Downloaded FFmpeg does not include libwebp"
          }

      - name: Compile and test conversion
        shell: pwsh
        run: |
          python -m compileall -q windows
          python -m unittest discover -s windows/tests -v

      - name: Build portable Windows application
        shell: pwsh
        run: |
          python windows/icon.py
          pyinstaller --noconfirm --clean --onedir --windowed --name MotionWebP --icon "windows/icon.ico" --add-binary "windows/bin/ffmpeg.exe;bin" --add-binary "windows/bin/ffprobe.exe;bin" windows/app.py
          if (!(Test-Path "dist/MotionWebP/MotionWebP.exe")) {
            throw "Portable EXE missing"
          }
          if (!(Test-Path "dist/MotionWebP/_internal/bin/ffmpeg.exe")) {
            throw "Bundled FFmpeg missing"
          }
          Copy-Item windows/README.md dist/MotionWebP/README.md
          Copy-Item windows/LICENSE_NOTICES.md dist/MotionWebP/LICENSE_NOTICES.md

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MotionWebP" -DestinationPath "dist/MotionWebP-Windows-portable.zip" -Force
          if ((Get-Item "dist/MotionWebP-Windows-portable.zip").Length -lt 10000000) {
            throw "Portable package appears incomplete"
          }

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: MotionWebP-Windows-portable
          path: dist/MotionWebP-Windows-portable.zip
          if-no-files-found: error
          retention-days: 30
